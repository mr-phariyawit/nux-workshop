<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiteOps Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<style>
/* Tokens: DESIGN.md v1.2 §2.2, §3–§5. Field surface is dark by default (dark-first). */
:root {
  color-scheme: dark;
  --color-bg-canvas: #0B1017;
  --color-bg-surface: #141C26;
  --color-bg-surface-raised: #22303F;
  --color-fg-primary: #F6F8FA;
  --color-fg-secondary: #D2DBE4;
  --color-border: #22303F;
  --color-border-strong: #4F5E70;
  --color-primary: #6FCBCB;
  --color-primary-hover: #0F8B8D;
  --color-on-primary: #0B1017;
  --color-status-p1: #F08A8A;
  --color-status-p2: #F5C56B;
  --color-status-p3: #8DB4F2;
  --color-status-done: #7BD5A2;
  --color-status-pending-sync: #F5C56B;
  --color-on-status-p1: #0B1017;
  --color-on-status-p2: #0B1017;
  --color-on-status-p3: #0B1017;
  --color-on-status-done: #0B1017;
  --color-focus-ring: #6FCBCB;
  --shadow-2: 0 4px 12px rgb(0 0 0 / .45);

  --font-sans: "Noto Sans Thai", "Inter", system-ui, sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-full: 9999px;
  --target-lg: 56px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --color-bg-canvas: #F6F8FA;
    --color-bg-surface: #FFFFFF;
    --color-bg-surface-raised: #FFFFFF;
    --color-fg-primary: #141C26;
    --color-fg-secondary: #4F5E70;
    --color-border: #D2DBE4;
    --color-border-strong: #8A98A8;
    --color-primary: #0B6F71;
    --color-primary-hover: #085456;
    --color-on-primary: #FFFFFF;
    --color-status-p1: #D63C3C;
    --color-status-p2: #BD7708;
    --color-status-p3: #2F6FD6;
    --color-status-done: #1E9E5A;
    --color-status-pending-sync: #BD7708;
    --color-on-status-p1: #FFFFFF;
    --color-on-status-p2: #141C26;
    --color-on-status-p3: #FFFFFF;
    --color-on-status-done: #141C26;
    --color-focus-ring: #0B6F71;
    --shadow-2: 0 4px 12px rgb(11 16 23 / .12);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --color-bg-canvas: #F6F8FA;
  --color-bg-surface: #FFFFFF;
  --color-bg-surface-raised: #FFFFFF;
  --color-fg-primary: #141C26;
  --color-fg-secondary: #4F5E70;
  --color-border: #D2DBE4;
  --color-border-strong: #8A98A8;
  --color-primary: #0B6F71;
  --color-primary-hover: #085456;
  --color-on-primary: #FFFFFF;
  --color-status-p1: #D63C3C;
  --color-status-p2: #BD7708;
  --color-status-p3: #2F6FD6;
  --color-status-done: #1E9E5A;
  --color-status-pending-sync: #BD7708;
  --color-on-status-p1: #FFFFFF;
  --color-on-status-p2: #141C26;
  --color-on-status-p3: #FFFFFF;
  --color-on-status-done: #141C26;
  --color-focus-ring: #0B6F71;
  --shadow-2: 0 4px 12px rgb(11 16 23 / .12);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 16px; line-height: 1.5;
  background: var(--color-bg-canvas);
  color: var(--color-fg-primary);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 20px; height: 20px; }

/* Demo controls: not part of the product surface */
.demo {
  display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; justify-content: center;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px dashed var(--color-border-strong);
  font-size: 14px; color: var(--color-fg-secondary);
}
.demo strong { font-weight: 600; margin-right: var(--space-1); }
.demo button {
  min-height: 44px; padding: 0 var(--space-3);
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-full);
  background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2);
}
.demo button[aria-pressed="true"] { background: var(--color-bg-surface-raised); border-color: var(--color-status-pending-sync); }

/* App column */
.app { max-width: 460px; margin: 0 auto; min-height: 100%; padding-inline: var(--space-4); padding-block: 0 140px; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--color-bg-canvas);
  padding-block: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2);
}
.topbar-row { display: flex; align-items: center; gap: var(--space-2); min-height: var(--target-lg); }
h1 { font-size: 22px; line-height: 30px; font-weight: 600; margin: 0; text-wrap: balance; }
h1:focus { outline: none; }
.sync-line { font-size: 14px; line-height: 20px; color: var(--color-fg-secondary); display: flex; align-items: center; gap: var(--space-2); }
.back {
  min-height: var(--target-lg); min-width: var(--target-lg); padding: 0 var(--space-3) 0 var(--space-1);
  border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-1);
  font-weight: 600; color: var(--color-primary); border-radius: var(--radius-md);
}

.offline {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
  background: var(--color-bg-surface-raised); border: 1px solid var(--color-status-pending-sync);
  font-weight: 600;
}
.offline .ico { color: var(--color-status-pending-sync); }
.offline small { display: block; font-weight: 400; font-size: 14px; color: var(--color-fg-secondary); }

.section-label { font-size: 14px; font-weight: 600; color: var(--color-fg-secondary); margin: var(--space-6) 0 var(--space-3); }
.list { display: flex; flex-direction: column; gap: var(--space-3); list-style: none; margin: 0; padding: 0; }

/* WorkOrderCard, variant field */
.card {
  position: relative; background: var(--color-bg-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3);
}
.card.p1-breach { border: 2px solid var(--color-status-p1); }
.card:hover { border-color: var(--color-border-strong); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; }
.wo-id { font-size: 14px; color: var(--color-fg-secondary); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.card h2 { font-size: 18px; line-height: 26px; font-weight: 600; margin: 0; }
.card-link { all: unset; cursor: pointer; }
.card-link::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius-lg); }
.card-link:focus-visible::after { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); font-size: 14px; color: var(--color-fg-secondary); }
.meta span { display: inline-flex; align-items: center; gap: var(--space-1); }
.badges { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.card .btn { position: relative; z-index: 1; }

/* StatusBadge */
.badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  min-height: 28px; padding: 2px var(--space-3); border-radius: var(--radius-full);
  font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap;
  border: 1px solid var(--color-border-strong); color: var(--color-fg-secondary); background: transparent;
}
.badge .ico { width: 16px; height: 16px; }
.badge.p1 { background: var(--color-status-p1); color: var(--color-on-status-p1); border-color: transparent; }
.badge.p2 { background: var(--color-status-p2); color: var(--color-on-status-p2); border-color: transparent; }
.badge.p3 { background: var(--color-status-p3); color: var(--color-on-status-p3); border-color: transparent; }
.badge.done { background: var(--color-status-done); color: var(--color-on-status-done); border-color: transparent; }
.badge.active { color: var(--color-primary); border-color: var(--color-primary); }
.badge.pending { border-style: dashed; }
.badge.pending .ico { color: var(--color-status-pending-sync); }

/* SlaCountdown */
.sla { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 600; color: var(--color-status-p1); font-variant-numeric: tabular-nums; }
.sla.breached { text-decoration: underline; text-underline-offset: 4px; }

/* Buttons, size tier lg */
.btn {
  min-height: var(--target-lg); padding: 0 var(--space-5); border-radius: var(--radius-md);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  font-weight: 600; cursor: pointer; border: 1px solid transparent; text-align: center;
  transition: background-color 150ms ease-out, border-color 150ms ease-out;
}
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-secondary { background: transparent; color: var(--color-fg-primary); border-color: var(--color-border-strong); }
.btn-secondary:hover { border-color: var(--color-fg-secondary); }
.btn-destructive { background: transparent; color: var(--color-status-p1); border-color: var(--color-status-p1); }
.btn[aria-disabled="true"] { background: var(--color-bg-surface-raised); color: var(--color-fg-secondary); border: 1px dashed var(--color-border-strong); cursor: not-allowed; }
.btn-block { width: 100%; }

/* Detail */
.detail { display: flex; flex-direction: column; gap: var(--space-4); }
.panel { background: var(--color-bg-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.panel h2 { font-size: 18px; line-height: 26px; font-weight: 600; margin: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-4); margin: 0; }
.kv dt { color: var(--color-fg-secondary); font-size: 14px; }
.kv dd { margin: 0; }
.photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); list-style: none; margin: 0; padding: 0; }
.tile { display: flex; flex-direction: column; gap: var(--space-2); }
.tile img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius-md); border: 1px solid var(--color-border); display: block; max-width: 100%; }
.tile-meta { font-size: 14px; color: var(--color-fg-secondary); display: flex; align-items: center; gap: var(--space-1); }
.tile-meta.queued .ico { color: var(--color-status-pending-sync); }
.tile-meta.sent .ico { color: var(--color-status-done); }
.add-photo { position: relative; }
.add-photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.add-photo:focus-within { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; border-radius: var(--radius-md); }
.reason { display: flex; gap: var(--space-2); align-items: flex-start; font-size: 14px; line-height: 20px; color: var(--color-fg-secondary); margin: 0; }
.empty-photos { font-size: 14px; color: var(--color-fg-secondary); margin: 0; }

/* Thumb-zone action bar */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding: var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom, 0px));
  background: var(--color-bg-surface); border-top: 1px solid var(--color-border);
}
.actionbar-inner { max-width: 428px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-2); }

/* Empty state */
.empty { text-align: center; padding: var(--space-8) var(--space-4); color: var(--color-fg-secondary); display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
.empty .ico { width: 40px; height: 40px; }

/* Sheet + toast */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 460px; background: var(--color-bg-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-2);
  padding: var(--space-6) var(--space-4) calc(var(--space-6) + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: var(--space-4);
}
.sheet h2 { font-size: 22px; line-height: 30px; font-weight: 600; margin: 0; }
.sheet p { margin: 0; color: var(--color-fg-secondary); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 15;
  width: calc(100% - 32px); max-width: 428px;
  background: var(--color-fg-primary); color: var(--color-bg-canvas);
  border-radius: var(--radius-md); box-shadow: var(--shadow-2);
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); font-weight: 600;
}
.toast .undo { min-height: var(--target-lg); padding: 0 var(--space-4); border: 0; border-radius: var(--radius-md); background: transparent; color: inherit; text-decoration: underline; cursor: pointer; font-weight: 600; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="demo" aria-label="ตัวควบคุมสาธิต" role="region">

<script>
(function () {
  "use strict";
  if (!document.documentElement.lang) document.documentElement.lang = "th";

  // Vocabulary: UX.md §6 glossary; status labels for non-glossary states are a recorded GAP.
  var STATUS = {
    "assigned":     { label: "มอบหมายแล้ว",   icon: "i-dot",      cls: "" },
    "acknowledged": { label: "รับงานแล้ว",     icon: "i-hand",     cls: "" },
    "in-progress":  { label: "กำลังทำ",        icon: "i-progress", cls: "active" },
    "temp-fix":     { label: "แก้ชั่วคราวแล้ว", icon: "i-wrench",   cls: "active" },
    "done":         { label: "ปิดงานแล้ว",     icon: "i-check",    cls: "done" }
  };
  var PRIORITY = {
    p1: { label: "ความสำคัญ P1", icon: "i-alert" },
    p2: { label: "ความสำคัญ P2", icon: "i-chevron-up" },
    p3: { label: "ความสำคัญ P3", icon: "i-minus" }
  };
  // FLOW-SOPS-001. One primary action per status (RULE-003).
  var NEXT = {
    "assigned":     { key: "acknowledge", label: "รับงาน",   icon: "i-hand", to: "acknowledged" },
    "acknowledged": { key: "start",       label: "เริ่มงาน", icon: "i-play", to: "in-progress" },
    "in-progress":  { key: "done",        label: "ปิดงาน",   icon: "i-check", to: "done" },
    "temp-fix":     { key: "done",        label: "ปิดงาน",   icon: "i-check", to: "done" }
  };
  var PRI_ORDER = { p1: 0, p2: 1, p3: 2 };

  function minutesFromNow(m) { return new Date(Date.now() + m * 60000); }
  function sampleOrders() {
    return [
      { id: "SOPS-2417", title: "ลิฟต์โดยสารตัวที่ 3 ค้างระหว่างชั้น 18–19", loc: "โถงลิฟต์ฝั่งตะวันออก ชั้น 18", pri: "p1", status: "in-progress",
        sla: minutesFromNow(-4), reporter: "คุณวิภา (อาคาร)", desc: "ไม่มีผู้โดยสารติดค้าง ปิดการใช้งานแล้ว ต้องรีเซ็ตคอนโทรลเลอร์", photos: [], pending: false },
      { id: "SOPS-2419", title: "น้ำรั่วจากท่อเมนเหนือตู้ไฟ", loc: "ห้องปั๊มน้ำ ชั้น B3", pri: "p1", status: "assigned",
        sla: minutesFromNow(47), reporter: "คุณสมชาย (รปภ.)", desc: "น้ำหยดต่อเนื่องใกล้ตู้ MDB-3 วางถาดรองไว้ชั่วคราว", photos: [], pending: false },
      { id: "SOPS-2412", title: "แอร์ไม่เย็น ห้องประชุมใหญ่", loc: "ชั้น 21 โซน C", pri: "p2", status: "acknowledged",
        sla: null, reporter: "คุณแพรว (ผู้เช่า Nimbus)", desc: "อุณหภูมิห้อง 28°C ตั้งไว้ 24°C มีประชุม 14:00", photos: [], pending: false },
      { id: "SOPS-2408", title: "หลอดไฟดับ 2 จุด", loc: "ทางเดินชั้น 9 หน้าห้อง 905", pri: "p3", status: "assigned",
        sla: null, reporter: "คุณอรุณ (แม่บ้าน)", desc: "หลอด LED panel 60×60 ดับ 2 แผง", photos: [], pending: false },
      { id: "SOPS-2401", title: "ประตูหนีไฟปิดไม่สนิท", loc: "บันไดหนีไฟ S2 ชั้น 12", pri: "p2", status: "done",
        sla: null, reporter: "คุณวิภา (อาคาร)", desc: "ปรับ door closer แล้ว", photos: [], pending: false }
    ];
  }

  var state = { orders: sampleOrders(), view: "list", openId: null, online: true, lastSync: new Date(), toastTimer: null, lastFocus: null };

  var app = document.getElementById("app");
  var overlay = document.getElementById("overlay");
  var toastHost = document.getElementById("toast-host");

  function ico(id, extra) { return '<svg class="ico' + (extra ? " " + extra : "") + '" aria-hidden="true" viewBox="0 0 24 24"><use href="#' + id + '"/></svg>'; }
  function hhmm(d) { return d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }); }
  function find(id) { return state.orders.filter(function (o) { return o.id === id; })[0]; }
  function queuedCount() {
    return state.orders.reduce(function (n, o) {
      return n + (o.pending ? 1 : 0) + o.photos.filter(function (p) { return p.queued; }).length;
    }, 0);
  }
  function sorted() {
    return state.orders.slice().sort(function (a, b) {
      var ad = a.status === "done", bd = b.status === "done";
      if (ad !== bd) return ad ? 1 : -1;
      if (PRI_ORDER[a.pri] !== PRI_ORDER[b.pri]) return PRI_ORDER[a.pri] - PRI_ORDER[b.pri];
      if (a.sla && b.sla) return a.sla - b.sla;
      return a.id < b.id ? 1 : -1;
    });
  }

  function slaText(o) {
    var ms = o.sla - Date.now();
    var neg = ms < 0; ms = Math.abs(ms);
    var m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
    var t = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    return neg ? "เกินกำหนด " + t : "เหลือ " + t;
  }
  function slaHtml(o) {
    if (o.pri !== "p1" || !o.sla || o.status === "done") return "";
    var breached = o.sla < Date.now();
    return '<span class="sla' + (breached ? " breached" : "") + '" role="timer" data-sla="' + o.id + '">' + ico("i-clock") + '<span>' + slaText(o) + "</span></span>";
  }
  function badges(o) {
    var s = STATUS[o.status], p = PRIORITY[o.pri];
    var h = '<span class="badge ' + o.pri + '">' + ico(p.icon) + p.label + "</span>";
    h += '<span class="badge ' + s.cls + '">' + ico(s.icon) + s.label + "</span>";
    if (o.pending) h += '<span class="badge pending">' + ico("i-pending") + "รอส่ง</span>";
    return h;
  }
  function offlineBanner() {
    if (state.online) return "";
    var n = queuedCount();
    return '<div class="offline" role="status">' + ico("i-wifi-off") +
      '<div>ออฟไลน์ · จะส่งเมื่อมีสัญญาณ<small>รอส่ง ' + n + " รายการ</small></div></div>";
  }
  function syncLine() {
    return state.online
      ? '<p class="sync-line">' + ico("i-cloud-check", "ico-sm") + "ซิงค์ล่าสุด " + hhmm(state.lastSync) + "</p>"
      : "";
  }

  function renderList() {
    var list = sorted();
    var active = list.filter(function (o) { return o.status !== "done"; });
    var done = list.filter(function (o) { return o.status === "done"; });
    var h = '<header class="topbar"><div class="topbar-row"><h1 tabindex="-1" id="view-title">งานของฉัน</h1></div>' + syncLine() + offlineBanner() + "</header>";
    h += '<p class="section-label">วันนี้ · ' + active.length + " ใบงาน</p>";
    if (!active.length) {
      h += '<div class="empty">' + ico("i-clipboard") + "<p>ยังไม่มีงานวันนี้</p></div>";
    } else {
      h += '<ul class="list">' + active.map(card).join("") + "</ul>";
    }
    if (done.length) {
      h += '<p class="section-label">ปิดแล้ววันนี้</p><ul class="list">' + done.map(card).join("") + "</ul>";
    }
    app.innerHTML = h;
  }

  function card(o) {
    var breach = o.pri === "p1" && o.sla && o.sla < Date.now() && o.status !== "done";
    var next = NEXT[o.status];
    var action = "";
    if (next && next.key !== "done") {
      action = '<button type="button" class="btn btn-primary btn-block" data-action="advance" data-id="' + o.id + '" aria-describedby="t-' + o.id + '">' + ico(next.icon) + next.label + "</button>";
    } else if (next) {
      action = '<button type="button" class="btn btn-secondary btn-block" data-action="open" data-id="' + o.id + '" aria-describedby="t-' + o.id + '">' + ico(next.icon) + next.label + "</button>";
    }
    return '<li><article class="card' + (breach ? " p1-breach" : "") + '" aria-labelledby="t-' + o.id + '">' +
      '<div class="card-head"><span class="wo-id">' + o.id + "</span>" + slaHtml(o) + "</div>" +
      '<h2 id="t-' + o.id + '"><button type="button" class="card-link" data-action="open" data-id="' + o.id + '">' + o.title + "</button></h2>" +
      '<div class="meta"><span>' + ico("i-pin", "ico-sm") + o.loc + "</span></div>" +
      '<div class="badges">' + badges(o) + "</div>" + action + "</article></li>";
  }

  function renderDetail() {
    var o = find(state.openId);
    var next = NEXT[o.status];
    var hasPhoto = o.photos.length > 0;
    var h = '<header class="topbar"><div class="topbar-row"><button type="button" class="back" data-action="back">' + ico("i-back") + "งานของฉัน</button></div>" + offlineBanner() + "</header>";
    h += '<div class="detail">';
    h += '<section class="panel" aria-labelledby="view-title"><div class="card-head"><span class="wo-id">' + o.id + "</span>" + slaHtml(o) + "</div>" +
      '<h1 tabindex="-1" id="view-title">' + o.title + "</h1>" +
      '<div class="badges">' + badges(o) + "</div>" +
      '<dl class="kv"><dt>สถานที่</dt><dd>' + o.loc + "</dd><dt>ผู้แจ้ง</dt><dd>" + o.reporter + "</dd><dt>รายละเอียด</dt><dd>" + o.desc + "</dd></dl></section>";

    h += '<section class="panel" aria-labelledby="ev-title"><h2 id="ev-title">หลักฐาน</h2>';
    if (!hasPhoto) h += '<p class="empty-photos">ยังไม่มีรูปหลักฐาน</p>';
    else {
      h += '<ul class="photos">' + o.photos.map(function (p, i) {
        var meta = p.queued
          ? '<p class="tile-meta queued">' + ico("i-pending", "ico-sm") + "รอส่ง · " + hhmm(p.at) + "</p>"
          : '<p class="tile-meta sent">' + ico("i-cloud-check", "ico-sm") + "ส่งแล้ว · " + hhmm(p.at) + "</p>";
        var del = p.queued ? '<button type="button" class="btn btn-destructive" data-action="delete-photo" data-index="' + i + '">' + ico("i-trash") + "ลบรูปที่ " + (i + 1) + "</button>" : "";
        return '<li class="tile"><img src="' + p.src + '" alt="หลักฐานรูปที่ ' + (i + 1) + " ของ " + o.id + '">' + meta + del + "</li>";
      }).join("") + "</ul>";
    }
    if (o.status !== "done") {
      h += '<label class="btn btn-secondary btn-block add-photo" for="photo-input">' + ico("i-camera") + "ถ่ายรูปหลักฐาน" +
        '<input id="photo-input" type="file" accept="image/*" capture="environment" data-action="add-photo"></label>';
    }
    h += "</section></div>";
    app.innerHTML = h;

    var bar = "";
    if (next) {
      var blocked = next.key === "done" && !hasPhoto;
      bar = '<div class="actionbar" role="region" aria-label="การทำงานกับใบงาน"><div class="actionbar-inner">';
      if (blocked) {
        bar += '<p class="reason" id="done-reason">' + ico("i-camera", "ico-sm") + "แนบหลักฐานอย่างน้อย 1 รูปก่อนปิดงาน</p>";
      }
      if (o.status === "in-progress") {
        bar += '<button type="button" class="btn btn-secondary btn-block" data-action="temp-fix">' + ico("i-wrench") + "แก้ชั่วคราว</button>";
      }
      bar += '<button type="button" class="btn btn-primary btn-block" id="primary-action" data-action="' + (next.key === "done" ? "ask-done" : "advance") + '" data-id="' + o.id + '"' +
        (blocked ? ' aria-disabled="true" aria-describedby="done-reason"' : "") + ">" + ico(next.icon) + next.label + "</button>";
      bar += "</div></div>";
    }
    overlay.innerHTML = bar;
  }

  function render() {
    if (state.view === "list") { overlay.innerHTML = ""; renderList(); }
    else renderDetail();
    document.getElementById("demo-photo").hidden = state.view !== "detail" || find(state.openId).status === "done";
  }

  function go(view, id) {
    state.view = view; state.openId = id || null;
    render();
    var t = document.getElementById("view-title");
    if (t) t.focus();
    window.scrollTo(0, 0);
  }

  function transition(o, to, verb) {
    var prev = { status: o.status, pending: o.pending };
    o.status = to;
    if (!state.online) o.pending = true;
    render();
    toast(verb + " " + o.id + (state.online ? "" : " · รอส่ง"), function () {
      o.status = prev.status; o.pending = prev.pending; render();
    });
  }

  function toast(text, undo) {
    clearTimeout(state.toastTimer);
    toastHost.innerHTML = '<div class="toast"><span>' + text + "</span>" + (undo ? '<button type="button" class="undo" data-action="undo">เลิกทำ</button>' : "") + "</div>";
    toastHost._undo = undo || null;
    state.toastTimer = setTimeout(function () { toastHost.innerHTML = ""; toastHost._undo = null; }, 6000);
  }

  function openSheet(o) {
    state.lastFocus = document.activeElement;
    app.inert = true; overlay.querySelector(".actionbar") && (overlay.querySelector(".actionbar").inert = true);
    var sheet = document.createElement("div");
    sheet.className = "scrim"; sheet.id = "sheet";
    sheet.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-describedby="sheet-desc">' +
      '<h2 id="sheet-title">ปิดงาน ' + o.id + "?</h2>" +
      '<p id="sheet-desc">แนบหลักฐาน ' + o.photos.length + " รูป ปิดแล้วใบงานจะเปลี่ยนเป็น “ปิดงานแล้ว” และผู้แจ้งจะได้รับแจ้ง</p>" +
      '<button type="button" class="btn btn-primary btn-block" data-action="confirm-done" data-id="' + o.id + '">' + ico("i-check") + "ยืนยันปิดงาน</button>" +
      '<button type="button" class="btn btn-secondary btn-block" data-action="close-sheet">ยกเลิก</button></div>';
    document.body.appendChild(sheet);
    sheet.querySelector("[data-action=confirm-done]").focus();
  }
  function closeSheet() {
    var s = document.getElementById("sheet");
    if (s) s.remove();
    app.inert = false;
    var bar = overlay.querySelector(".actionbar"); if (bar) bar.inert = false;
    if (state.lastFocus && document.contains(state.lastFocus)) state.lastFocus.focus();
  }

  function addPhoto(o, src) {
    o.photos.push({ src: src, at: new Date(), queued: !state.online });
    render();
    toast(state.online ? "แนบหลักฐานแล้ว" : "แนบหลักฐานแล้ว · รอส่ง");
  }
  function samplePhotoSrc() {
    var c = document.createElement("canvas"); c.width = 640; c.height = 480;
    var g = c.getContext("2d");
    var grd = g.createLinearGradient(0, 0, 640, 480); grd.addColorStop(0, "#22303F"); grd.addColorStop(1, "#4F5E70");
    g.fillStyle = grd; g.fillRect(0, 0, 640, 480);
    g.fillStyle = "#8A98A8"; g.fillRect(80, 60, 480, 40); g.fillRect(260, 100, 40, 260);
    g.fillStyle = "#8DB4F2"; for (var i = 0; i < 6; i++) { g.beginPath(); g.arc(280, 380 + i * 12, 10 - i, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = "#F6F8FA"; g.font = "600 28px sans-serif"; g.fillText("ตัวอย่าง · " + hhmm(new Date()), 24, 452);
    return c.toDataURL("image/jpeg", 0.8);
  }

  function setOnline(on) {
    state.online = on;
    var b = document.getElementById("demo-offline");
    b.setAttribute("aria-pressed", String(!on));
    b.querySelector("span").textContent = on ? "จำลองออฟไลน์" : "กลับมาออนไลน์";
    render();
    if (on) {
      var n = queuedCount();
      if (n) {
        setTimeout(function () {
          state.orders.forEach(function (o) { o.pending = false; o.photos.forEach(function (p) { p.queued = false; }); });
          state.lastSync = new Date(); render(); toast("ส่งครบแล้ว " + n + " รายการ");
        }, 1200);
      }
    }
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var act = el.getAttribute("data-action");
    var o = el.dataset.id ? find(el.dataset.id) : (state.openId ? find(state.openId) : null);
    if (act === "open") go("detail", el.dataset.id);
    else if (act === "back") go("list");
    else if (act === "advance") {
      var n = NEXT[o.status];
      transition(o, n.to, n.key === "acknowledge" ? "รับงาน" : "เริ่มงาน");
    }
    else if (act === "temp-fix") transition(o, "temp-fix", "แก้ชั่วคราว");
    else if (act === "ask-done") {
      if (el.getAttribute("aria-disabled") === "true") {
        var inp = document.getElementById("photo-input");
        if (inp) inp.focus();
        return;
      }
      openSheet(o);
    }
    else if (act === "confirm-done") {
      closeSheet();
      o.status = "done"; if (!state.online) o.pending = true;
      go("list");
      toast("ปิดงาน " + o.id + " แล้ว" + (state.online ? "" : " · รอส่ง"));
    }
    else if (act === "close-sheet") closeSheet();
    else if (act === "delete-photo") { o.photos.splice(Number(el.dataset.index), 1); render(); toast("ลบรูปแล้ว"); }
    else if (act === "undo") { var u = toastHost._undo; toastHost.innerHTML = ""; toastHost._undo = null; if (u) u(); }
    else if (act === "toggle-offline") setOnline(!state.online);
    else if (act === "sample-photo") { if (state.openId) addPhoto(find(state.openId), samplePhotoSrc()); }
    else if (act === "reset") { state.orders = sampleOrders(); state.lastSync = new Date(); if (!state.online) setOnline(true); go("list"); }
  });

  document.addEventListener("change", function (e) {
    if (e.target.id !== "photo-input" || !e.target.files || !e.target.files[0]) return;
    var o = find(state.openId);
    var r = new FileReader();
    r.onload = function () { addPhoto(o, String(r.result)); var i = document.getElementById("photo-input"); if (i) i.focus(); };
    r.readAsDataURL(e.target.files[0]);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("sheet")) closeSheet();
  });

  // SLA tick: text only, no motion (DESIGN.md §8).
  setInterval(function () {
    Array.prototype.forEach.call(document.querySelectorAll("[data-sla]"), function (el) {
      var o = find(el.getAttribute("data-sla"));
      if (o) el.lastElementChild.textContent = slaText(o);
    });
  }, 1000);

  render();
}());
</script>
</body>
</html>
