<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ · SiteOps</title>
  <style>
    /* Tokens from DESIGN.md v1.1 §2.2 (light) and §3–§5. Field surface size tier lg. */
    :root {
      --color-bg-canvas: #F6F8FA;
      --color-bg-surface: #FFFFFF;
      --color-fg-primary: #141C26;
      --color-fg-secondary: #4F5E70;
      --color-border: #D2DBE4;
      --color-primary: #0B6F71;
      --color-primary-hover: #085456;
      --color-on-primary: #FFFFFF;
      --color-status-p1: #D63C3C;
      --color-focus-ring: #0B6F71;
      --radius-md: 10px;
      --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
      --font-sans: "Noto Sans Thai", "Inter", system-ui, sans-serif;
    }
    body { margin: 0; font-family: var(--font-sans); background: var(--color-bg-canvas); color: var(--color-fg-primary); font-size: 16px; line-height: 1.5; }
    main { max-width: 360px; margin: 40px auto; background: var(--color-bg-surface); padding: var(--space-6); border-radius: var(--radius-md); border: 1px solid var(--color-border); }
    .logo { display: block; width: 120px; height: 40px; margin: 0 auto var(--space-3); }
    h1 { font-size: 22px; line-height: 30px; font-weight: 600; text-align: center; margin: 0 0 var(--space-6); }
    .field { margin-bottom: var(--space-4); }
    label { display: block; font-weight: 600; margin-bottom: var(--space-2); }
    input { width: 100%; box-sizing: border-box; height: 56px; padding: 0 var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); font: inherit; color: var(--color-fg-primary); background: var(--color-bg-surface); }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }
    input[aria-invalid="true"] { border-color: var(--color-status-p1); border-width: 2px; }
    .error-text { display: flex; gap: var(--space-2); align-items: center; color: var(--color-status-p1); font-size: 14px; line-height: 20px; margin-top: var(--space-2); }
    .error-text svg { flex: none; }
    .actions { display: flex; gap: var(--space-3); align-items: center; margin-top: var(--space-6); }
    button { font: inherit; font-weight: 600; cursor: pointer; border-radius: var(--radius-md); }
    .btn-primary { flex: 1; height: 56px; background: var(--color-primary); color: var(--color-on-primary); border: 0; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-ghost { width: 56px; height: 56px; background: transparent; border: 1px solid var(--color-border); color: var(--color-fg-secondary); display: inline-flex; align-items: center; justify-content: center; }
    .links { margin-top: var(--space-4); text-align: center; }
    .links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-3); color: var(--color-primary); font-weight: 600; text-decoration: underline; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <main>
    <img class="logo" alt="SiteOps" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='40'><rect width='120' height='40' fill='%230F8B8D'/></svg>">
    <h1>เข้าสู่ระบบ</h1>

    <form novalidate onsubmit="return false">
      <div class="field">
        <label for="username">ชื่อผู้ใช้ <span aria-hidden="true">*</span><span class="sr-only">(จำเป็น)</span></label>
        <input id="username" name="username" type="text" autocomplete="username" required inputmode="text">
      </div>

      <div class="field">
        <label for="password">รหัสผ่าน <span aria-hidden="true">*</span><span class="sr-only">(จำเป็น)</span></label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               aria-invalid="true" aria-describedby="password-error">
        <p id="password-error" class="error-text" role="alert">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
          <span>รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง หรือกด "ลืมรหัสผ่าน"</span>
        </p>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
          เข้าสู่ระบบ
        </button>
        <button type="button" class="btn-ghost" aria-label="วิธีใช้">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
        </button>
      </div>
    </form>

    <div class="links">
      <a href="#reset">ลืมรหัสผ่าน</a>
    </div>
  </main>
</body>
</html>
