<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f2f2; color: #777; }
    .wrap { max-width: 360px; margin: 40px auto; background: #fff; padding: 24px; }
    .logo { display: block; width: 120px; margin: 0 auto 12px; }
    .title { font-size: 20px; color: #999; text-align: center; margin-bottom: 20px; }
    .field { margin-bottom: 12px; }
    input { width: 100%; box-sizing: border-box; height: 32px; padding: 0 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; }
    input:focus { outline: none; }
    .error { border-color: #f5a5a5; }
    .btn { display: inline-block; background: #9dd; color: #fff; padding: 6px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
    .link { color: #aaa; font-size: 12px; }
    .help { width: 18px; height: 18px; display: inline-block; background: #ddd; border-radius: 50%; text-align: center; font-size: 11px; line-height: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='40'><rect width='120' height='40' fill='%230F8B8D'/></svg>">
    <div class="title">SiteOps</div>

    <div class="field">
      <input type="text" placeholder="Username">
    </div>
    <div class="field">
      <input type="password" placeholder="Password" class="error">
    </div>

    <div class="row">
      <div class="btn" onclick="login()">Login</div>
      <span class="help" onclick="alert('help')">?</span>
    </div>
    <div class="row">
      <span class="link" onclick="alert('reset')">Forgot password</span>
    </div>
  </div>
  <script>function login(){}</script>
</body>
</html>
